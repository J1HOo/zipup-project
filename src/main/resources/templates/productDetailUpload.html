<!--판매자용 제품 등록 페이지-->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>productDetailUpload</title>
    <link rel="stylesheet" href="../static/css/styles.css">
    <style>
        /* -------------------- 판매자 생성 파트 ----------------------- */

        .seller-detail-container {
            display: grid;
            grid-template-columns: 411px 421px; /*열 배치 크기*/
            gap: 40px 35px; /*그리드 간격 row column*/
            grid-template-rows: repeat(6, minmax(59px, auto));
            justify-content: center;
            padding: 20px;
            align-items: start;
        }

        .seller-detail-container .seller-optionColor, .seller-detail-container .seller-optionSize {
            width: 360px;
            height: 42px;
            border: 1px solid #999999;
            border-radius: 8px;
            padding: 12px;
            box-sizing: border-box;
            margin-bottom: 15px;
            font-size: 15px;
        }

        .seller-detail-container .seller-option-add-button1, .seller-detail-container .seller-option-add-button2 {
            width: 41px;
            height: 41px;
            background-color: white;
            border-radius: 8px;
            border: solid 1px #999999;
        }

        .seller-detail-container .seller-optionColor:focus, .seller-detail-container .seller-optionSize:focus {
            border: solid 2px #3e71fe;
            outline: none;
        }

        /* 인풋 포커스와 버튼 색상 동기화 */
        .seller-detail-container:has(.seller-optionColor:focus) .seller-option-add-button1 {
            border: solid 2px #3e71fe;
            outline: none;
            content: url("../images/svg/plusBlue.svg")
        }

        .seller-detail-container:has(.seller-optionColor:focus) .plus-icon1 {
            content: url("../images/svg/plusBlue.svg")
        }

        .seller-detail-container:has(.seller-optionSize:focus) .seller-option-add-button2 {
            border: solid 2px #3e71fe;
            outline: none;
        }

        .seller-detail-container:has(.seller-optionSize:focus) .plus-icon2 {
            content: url("../images/svg/plusBlue.svg")
        }


        .seller-detail-container .product-image {
            display: flex;
            width: 411px;
            height: 411px;
            border: solid 1px gray;
            margin-top: 12px;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .seller-detail-container .product-image:hover {
            border: solid 2px #3e71fe;
            color: #3e71fe;
            font-weight: bold;
        }

        .seller-detail-container .detail-image {
            width: 868px;
            height: auto;
            background-color: white;
            color: white;
            text-align: center;
        }

        .seller-detail-container .right-section {
            line-height: 40px;
        }

        .seller-detail-container .category {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
        }

        .seller-detail-container .category-btn {
            width: 100px;
            height: 31px;
            background-color: #D9D9D9;
            border: none;
            border-radius: 5px;
        }

        .seller-detail-container .category-btn:focus {
            background-color: #3e71fe;
            color: white;
        }

        .seller-detail-container .upload-detail-image {
            width: 868px;
            height: 51px;
            background-color: black;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
        }

        .seller-detail-container .upload-detail-image:hover {
            background-color: #333;
        }

        .seller-detail-container .upload-icon {
            padding-left: 8px;
            width: 20px;
        }

        .seller-detail-container .not-option-btn {
            width: 407px;
            height: 42px;
            border: 1px solid gray;
            border-radius: 10px;
            padding: 10px;
            box-sizing: border-box;
            margin-bottom: 40px;
            font-size: 16px;
            background-color: white;
        }

        .seller-detail-container .not-option-btn:focus {
            background-color: #3e71fe;
            color: white;
            border: none;
        }

    </style>
</head>

<header class="header">
    <div class="logo">
        <img src="/images/svg/logo.svg" alt="ZIP UP" class="hf-logo">
    </div>
    <nav class="nav">
        <a th:href="@{/all}" class="active">ALL</a>
        <a th:href="@{/outer}">OUTER</a>
        <a th:href="@{/top}">TOP</a>
        <a th:href="@{/bottom}">BOTTOM</a>
        <a th:href="@{/acc}">ACC</a>
    </nav>
    <div class="auth-links">
        <a th:href="@{/signup}">회원가입</a>
        <a th:href="@{/login}">로그인</a>
    </div>
</header>


<body>
<!-- 전체 컨테이너 -->
<div class="seller-detail-container">
    <!-- 좌측 상단 그리드 -->
    <div class="left-section">
        <div class="image">
            <label class="zipup-label">이미지</label>
            <div class="product-image">빈 공간을 클릭하여<br> 이미지를 추가해주세요</div>
        </div>
    </div>
    <!-- 우측 상단 그리드 -->
    <div class="right-section">
        <label class="zipup-label">카테고리</label>
        <div class="category">
            <button class="category-btn">OUTER</button>
            <button class="category-btn">TOP</button>
            <button class="category-btn">BOTTOM</button>
            <button class="category-btn">ACC</button>
        </div>
        <div class="product">
            <label class="zipup-label">상품 등록</label>
            <input type="text" class="zipup-input" type="text" placeholder="상품명"/>
            <input type="text" class="zipup-input" type="text" placeholder="상품가격"/>
        </div>
        <div class="options">
            <label class="zipup-label">상품 옵션 설정</label>
            <div class="option-container">
                <input type="text" class="seller-optionColor" type="text" placeholder="색상 옵션 추가"/>
                <button class="seller-option-add-button1">
                    <span><img src="../../assets/svg/plusGray.svg" class="plus-icon1"></span>
                </button>
            </div>
            <div class="option-container">
                <input type="text" class="seller-optionSize" type="text" placeholder="사이즈 옵션 추가"/>
                <button class="seller-option-add-button2">
                    <span><img src="../../assets/svg/plusGray.svg" class="plus-icon2"></span>
                </button>
                <button class="not-option-btn" >옵션 없음</button>
                <button class="zipup-btn">등록하기</button>
            </div>
        </div>
    </div>
    <!-- 하단 그리드 -->
    <div class="bottom-section">
        <button class="upload-detail-image">상세페이지 등록 <img src="../../assets/svg/upload.svg" class="upload-icon"></button>

        <!-- 상세페이지 이미지 등록하기 전에는 형태 나타나지 않게 보여짐-->
        <div class="detail-image" hidden>상세페이지</div>
    </div>
</div>
</body>
</html>
